<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta name="theme-color" content="#030507">

  <title>JARVIS V6</title>

  <link rel="stylesheet" href="/frontend/style.css">
</head>

<body>

  <main id="jarvis-app">

    <!-- TOPBAR -->
    <header id="barra-superior">

      <div class="brand">
        <span class="brand-mark">J</span>

        <div>
          <strong>JARVIS</strong>
          <small>V6 CORE</small>
        </div>
      </div>

      <div id="system-status" class="status offline">
        <span class="status-dot"></span>
        <span id="system-status-text">OFFLINE</span>
      </div>

    </header>


    <!-- NÚCLEO -->
    <section id="core-section">

      <div id="core-orb">

        <div class="core-ring ring-1"></div>
        <div class="core-ring ring-2"></div>
        <div class="core-ring ring-3"></div>

        <div class="core-center">
          <span id="core-state">STANDBY</span>
          <strong>J</strong>
          <small>JARVIS V6</small>
        </div>

      </div>

      <div id="assistant-message">
        Inicializando JARVIS...
      </div>

    </section>


    <!-- CONSOLE -->
    <section id="console">

      <div id="mensagens"></div>

    </section>


    <!-- COMANDOS -->
    <section id="command-area">

      <form id="command-form">

        <input
          id="command-input"
          type="text"
          autocomplete="off"
          placeholder="Fale ou digite um comando..."
        >

        <button id="send-button" type="submit">
          ➤
        </button>

      </form>


      <div id="voice-controls">

        <button id="voice-button" type="button">
          🎙 OUVIR
        </button>

        <button id="stop-voice-button" type="button">
          ■ PARAR
        </button>

      </div>

    </section>


    <!-- NAVEGAÇÃO -->
    <nav id="bottom-nav">

      <button class="nav-item active" data-section="core">
        ◉ CORE
      </button>

      <button class="nav-item" data-section="memory">
        ◆ MEMÓRIA
      </button>

      <button class="nav-item" data-section="automation">
        ◇ AUTO
      </button>

      <button class="nav-item" data-section="workflow">
        ▣ WORKFLOW
      </button>

      <button class="nav-item" data-section="settings">
        ⚙ CONFIG
      </button>

    </nav>


    <!-- DEBUG -->
    <section id="debug-panel" hidden>

      <button id="close-debug" type="button">
        FECHAR
      </button>

      <pre id="debug-output"></pre>

    </section>

  </main>


  <!-- IMPORTANTE:
       Caminho absoluto para o JS dentro de frontend -->
  <script
    type="module"
    src="/frontend/app.js">
  </script>

</body>
</html>
